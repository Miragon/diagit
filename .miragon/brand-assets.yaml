# miragon-brand/brand-assets: neu kopieren mit brand-assets.mjs, die Kopien nie von Hand ändern
# Alle Dateien, die dieses Repo aus dem Plugin miragon-brand kopiert. "source" ist relativ zum Plugin,
# "out" relativ zum Repo. Neue Einträge mit: brand-assets.mjs --add <source> <out>
# Die Prüfsummen der Kopien schreibt brand-assets.mjs nach .miragon/brand-assets.sha256, die CI prüft sie mit sha256sum -c.
skillVersion: 1.32.0
files:
  - source: scripts/brand-lint.mjs
    out: .miragon/brand-lint/brand-lint.mjs
  - source: scripts/brand-lint.generated.json
    out: .miragon/brand-lint/brand-lint.generated.json
  - source: skills/modeler-tool-design/assets/cd-tokens.generated.css
    out: packages/extension/src/platform/theme/cd-tokens.generated.css
  - source: skills/modeler-tool-design/assets/cd-tokens.generated.json
    out: packages/extension/src/platform/theme/cd-tokens.generated.json
  - source: skills/modeler-tool-design/assets/cd-canvas.css
    out: packages/extension/src/platform/theme/cd-canvas.css
