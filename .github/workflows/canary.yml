name: Canary (GitHub DOM drift)

# Checks on the real github.com that the diagram still renders; red means githubSelectors.ts needs an update.
# Scheduled instead of on PRs, so GitHub's flakiness never blocks a merge.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live injection on github.com
    runs-on: ubuntu-latest
    outputs:
      screenshots-url: ${{ steps.screenshots.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Normal build, so the real github.com matches apply.
      - name: Build extension
        run: npm run build -w @diagit/extension

      - name: Live canary (Chrome, real github.com)
        run: npm run test:e2e:live -w @diagit/extension
        env:
          WDIO_BROWSERS: chrome
          WDIO_SCREENSHOTS: '1'

      - name: Upload canary screenshots
        id: screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-screenshots
          path: packages/extension/.output/e2e-screenshots/
          if-no-files-found: ignore
          retention-days: 14

  report-failure:
    name: Report failure in an issue
    needs: live
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or comment on the canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCREENSHOTS_URL: ${{ needs.live.outputs.screenshots-url }}
        run: |
          report="The scheduled canary failed.

          - Run: $RUN_URL
          - Screenshots: ${SCREENSHOTS_URL:-none uploaded}"
          open_issue=$(gh issue list --label canary --state open --json number --jq '.[0].number // empty')
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body "$report"
          else
            gh label create canary --color d93f0b --description 'Failed run of the GitHub drift canary' --force
            gh issue create --title 'GitHub drift canary failed' --label canary --body "$report

          The canary drives the real github.com with the extension loaded. A failure usually means GitHub changed its DOM: update \`packages/extension/src/git-hosts/github/githubSelectors.ts\` and the fixtures, then close this issue. Further failures are added as comments while it is open."
          fi
