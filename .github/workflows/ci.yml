name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Architecture check (dependency-cruiser)
        run: npm run lint:deps

      - name: Unused files, exports & dependencies (knip)
        run: npm run knip

      - name: Unit tests
        run: npm test

      - name: Build extension (Chrome + Firefox)
        run: npm run build

      - name: Artifact size budget (size-limit)
        run: npm run size

      - name: Validate Firefox bundle (web-ext lint)
        run: npm run lint:webext -w @diagit/extension

  # The Miragon corporate identity. The files from Miragon/corporate-identity
  # (brand-lint and the design tokens) are copied with brand-assets.mjs and listed in
  # .miragon/brand-assets.yaml, because that repo is private.
  # Fails when someone edited a copy or a file breaks a hard brand rule.
  brand:
    name: Miragon brand
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Brand files unchanged since the last copy
        run: sha256sum -c .miragon/brand-assets.sha256

      - name: Brand lint (hard rules fail, soft hints are logged)
        run: node .miragon/brand-lint/brand-lint.mjs .

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
        include:
          - browser: firefox
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension (E2E)
        run: npm run e2e:build -w @diagit/extension

      - name: E2E tests
        run: npm run test:e2e -w @diagit/extension
        env:
          WDIO_BROWSERS: ${{ matrix.browser }}
