name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate the store bundles without uploading to any store'
        type: boolean
        default: true
      tag:
        description: 'Release tag to publish, e.g. v0.2.1 (empty = latest release)'
        type: string
      store:
        description: 'Store to publish to'
        type: choice
        options: [all, chrome, edge, firefox]
        default: all

# No permissions by default; each job asks for what it needs.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs['packages/extension--tag_name'] }}
    steps:
      # A GitHub App token (not the default GITHUB_TOKEN) so release-please can
      # open the release PR — the default token is blocked from creating PRs.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Human approval gate. The `release` environment has a required reviewer, so
  # the pipeline pauses here until the deployment is approved — nothing is
  # packaged or published before that. Runs for a real release, or for a manual
  # re-publish (workflow_dispatch, dry_run unchecked). A dry run only builds and
  # lints in verify-bundles, so it needs no approval. A rejected release stays
  # a draft without bundles: a re-publish naming its tag fails, and one without
  # a tag picks the latest published release instead. Recover with "Re-run
  # failed jobs" on the original run.
  gate:
    name: Await release approval
    needs: release-please
    if: >-
      needs.release-please.outputs.releases_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Approved
        run: echo "Release approved."

  # On an approved release, build and attest the store bundles, attach them to
  # the draft GitHub release and publish it. Publishing to the Chrome Web Store /
  # AMO / Edge is intentionally a separate, secret-gated step so this pipeline works
  # out of the box without any store credentials.
  package:
    needs: [release-please, gate]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & zip (Chrome + Firefox)
        run: npm run zip -w @diagit/extension

      - name: Attest the store bundles
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/extension/.output/*.zip

      - name: Upload store bundles to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" packages/extension/.output/*.zip --clobber

      - name: Store bundles as build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-bundles
          path: packages/extension/.output/*.zip
          if-no-files-found: error
          include-hidden-files: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --latest

  # Manual dry run (workflow_dispatch, dry_run checked): build + lint the store
  # bundles without uploading and without touching the protected environment.
  verify-bundles:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & zip (Chrome + Firefox)
        run: npm run zip -w @diagit/extension

      - name: Validate bundles
        run: |
          ls -la packages/extension/.output/*.zip
          npm run lint:webext -w @diagit/extension

      - name: Check the pinned store upload CLIs resolve
        working-directory: packages/extension
        run: |
          npm exec --no -- chrome-webstore-upload --version
          npm exec --no -- web-ext --version

  # Real upload to the stores, after the `gate` approval. Runs on its own after a
  # release was packaged, or manually (workflow_dispatch, dry_run unchecked) to
  # re-publish an existing release.
  # Always ships the bundles attached to the GitHub release of the tag, never a
  # fresh build of main, and only once their attestation proves this workflow
  # built them on main. Each store runs only when its secrets exist, so
  # unconfigured stores (e.g. Edge before you have its keys) are skipped, and a
  # failing store does not stop the others — the job still ends red.
  # Add the credentials to the `store-publishing` environment.
  publish:
    needs: [release-please, gate, package]
    if: >-
      !cancelled() && needs.gate.result == 'success' && (
        (github.event_name == 'push' && needs.package.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && needs.package.result != 'failure')
      )
    runs-on: ubuntu-latest
    environment: store-publishing
    permissions:
      contents: read
      attestations: read
    steps:
      # The upload CLIs come from the lockfile of the workflow's own commit,
      # installed without lifecycle scripts since this job holds the store
      # secrets. Only the bundles are bound to the release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve the release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: echo "tag=${TAG:-$(gh release view --json tagName --jq .tagName)}" >> "$GITHUB_OUTPUT"

      - name: Download and verify the store bundles of the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern '*-chrome.zip' --pattern '*-firefox.zip' --dir bundles
          for bundle in bundles/*.zip; do
            gh attestation verify "$bundle" --repo Miragon/diagit \
              --signer-workflow Miragon/diagit/.github/workflows/release-please.yml \
              --source-ref refs/heads/main
          done
          unzip -q bundles/*-firefox.zip -d bundles/firefox-mv3
          ls -la bundles

      - name: Detect which stores are configured
        id: stores
        env:
          STORE: ${{ inputs.store || 'all' }}
          CHROME_ID: ${{ secrets.CHROME_ID }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
        run: |
          enabled() { { [ "$STORE" = all ] || [ "$STORE" = "$1" ]; } && [ -n "$2" ] && echo true || echo false; }
          {
            echo "chrome=$(enabled chrome "$CHROME_ID")"
            echo "edge=$(enabled edge "$EDGE_PRODUCT_ID")"
            echo "firefox=$(enabled firefox "$AMO_JWT_ISSUER")"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to Chrome Web Store
        if: ${{ !cancelled() && steps.stores.outputs.chrome == 'true' }}
        env:
          EXTENSION_ID: ${{ secrets.CHROME_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        working-directory: packages/extension
        run: |
          npm exec --no -- chrome-webstore-upload \
            --source "$(ls "$GITHUB_WORKSPACE"/bundles/*-chrome.zip | head -n1)"

      - name: Publish to Edge Add-ons
        if: ${{ !cancelled() && steps.stores.outputs.edge == 'true' }}
        uses: wdzeng/edge-addon@9881f57720358040d079eaa06a4596dc9c273eb6 # v2.1.1
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: bundles/*-chrome.zip
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}

      - name: Sign & publish to Firefox AMO
        if: ${{ !cancelled() && steps.stores.outputs.firefox == 'true' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        working-directory: packages/extension
        run: |
          npm exec --no -- web-ext sign --no-config-discovery --channel listed \
            --source-dir "$GITHUB_WORKSPACE/bundles/firefox-mv3" \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
