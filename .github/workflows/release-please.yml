name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate the store bundles without uploading to any store'
        type: boolean
        default: true
      tag:
        description: 'Release tag to publish, e.g. v0.2.1 (empty = latest release)'
        type: string
      store:
        description: 'Store to publish to'
        type: choice
        options: [all, chrome, edge, firefox]
        default: all

# No permissions by default; each job asks for what it needs.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs['packages/extension--tag_name'] }}
    steps:
      # An app token, because the default GITHUB_TOKEN may not open the release PR.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Nothing is packaged or published until a reviewer approves the `release` environment.
  # A rejected release stays a draft; recover with "Re-run failed jobs" on the original run.
  gate:
    name: Await release approval
    needs: release-please
    if: >-
      needs.release-please.outputs.releases_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Approved
        run: echo "Release approved."

  # Builds and attests the store bundles, attaches them to the draft release and publishes it.
  package:
    needs: [release-please, gate]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & zip (Chrome + Firefox)
        run: npm run zip -w @diagit/extension

      - name: Attest the store bundles
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/extension/.output/*.zip

      - name: Upload store bundles to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" packages/extension/.output/*.zip --clobber

      - name: Store bundles as build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-bundles
          path: packages/extension/.output/*.zip
          if-no-files-found: error
          include-hidden-files: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --latest

  # Manual dry run: builds and lints the store bundles without uploading them.
  verify-bundles:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & zip (Chrome + Firefox)
        run: npm run zip -w @diagit/extension

      - name: Validate bundles
        run: |
          ls -la packages/extension/.output/*.zip
          npm run lint:webext -w @diagit/extension

      - name: Check the pinned store upload CLIs resolve
        working-directory: packages/extension
        run: |
          npm exec --no -- chrome-webstore-upload --version
          npm exec --no -- web-ext --version

  # Uploads the attested bundles of the release, one job per store, so "Re-run failed jobs" repeats only the failed store.
  # A store without credentials in the `store-publishing` environment is skipped.
  publish:
    name: publish (${{ matrix.store }})
    needs: [release-please, gate, package]
    if: >-
      !cancelled() && needs.gate.result == 'success' && (
        (github.event_name == 'push' && needs.package.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && needs.package.result != 'failure')
      )
    strategy:
      fail-fast: false
      matrix:
        store: ${{ fromJSON(inputs.store && inputs.store != 'all' && format('["{0}"]', inputs.store) || '["chrome","edge","firefox"]') }}
    runs-on: ubuntu-latest
    environment: store-publishing
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Detect whether the store is configured
        id: store
        env:
          STORE: ${{ matrix.store }}
          CHROME_ID: ${{ secrets.CHROME_ID }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
        run: |
          case "$STORE" in
            chrome) credential="$CHROME_ID" ;;
            edge) credential="$EDGE_PRODUCT_ID" ;;
            firefox) credential="$AMO_JWT_ISSUER" ;;
          esac
          configured=$([ -n "$credential" ] && echo true || echo false)
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          if [ "$configured" = false ]; then
            echo "::notice::$STORE has no credentials in store-publishing, skipping."
          fi

      # Without lifecycle scripts, since this job holds the store secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.store.outputs.configured == 'true'
        with:
          persist-credentials: false

      - name: Setup Node
        if: steps.store.outputs.configured == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.store.outputs.configured == 'true' && matrix.store != 'edge'
        run: npm ci --ignore-scripts

      - name: Resolve the release tag
        id: release
        if: steps.store.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: echo "tag=${TAG:-$(gh release view --json tagName --jq .tagName)}" >> "$GITHUB_OUTPUT"

      - name: Download and verify the store bundle of the release
        if: steps.store.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          BUNDLE: ${{ matrix.store == 'firefox' && 'firefox' || 'chrome' }}
        run: |
          gh release download "$TAG" --pattern "*-$BUNDLE.zip" --dir bundles
          gh attestation verify bundles/*-"$BUNDLE".zip --repo Miragon/diagit \
            --signer-workflow Miragon/diagit/.github/workflows/release-please.yml \
            --source-ref refs/heads/main
          if [ "$BUNDLE" = firefox ]; then
            unzip -q bundles/*-firefox.zip -d bundles/firefox-mv3
          fi
          ls -la bundles

      - name: Publish to Chrome Web Store
        if: steps.store.outputs.configured == 'true' && matrix.store == 'chrome'
        env:
          EXTENSION_ID: ${{ secrets.CHROME_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        working-directory: packages/extension
        run: |
          npm exec --no -- chrome-webstore-upload \
            --source "$(ls "$GITHUB_WORKSPACE"/bundles/*-chrome.zip | head -n1)"

      - name: Publish to Edge Add-ons
        if: steps.store.outputs.configured == 'true' && matrix.store == 'edge'
        uses: wdzeng/edge-addon@9881f57720358040d079eaa06a4596dc9c273eb6 # v2.1.1
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: bundles/*-chrome.zip
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}

      - name: Sign & publish to Firefox AMO
        if: steps.store.outputs.configured == 'true' && matrix.store == 'firefox'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        working-directory: packages/extension
        run: |
          npm exec --no -- web-ext sign --no-config-discovery --channel listed \
            --source-dir "$GITHUB_WORKSPACE/bundles/firefox-mv3" \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
